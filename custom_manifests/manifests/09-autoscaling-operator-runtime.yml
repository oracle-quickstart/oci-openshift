# 11-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-capi-operator-controller-manager
  namespace: oci-openshift-autoscaling-operator
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: oci-capi-autoscaling-operator
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: oci-capi-autoscaling-operator
        control-plane: controller-manager
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
                - arm64
      containers:
      - args:
        - run
        - --leader-elect
        - --metrics-bind-address=:28080
        - --health-probe-bind-address=:28081
        command:
        - /manager
        env:
        - name: HOME
          value: /tmp
        - name: XDG_CACHE_HOME
          value: /tmp/.cache
        - name: OCI_CREDENTIALS_FINGERPRINT
          valueFrom:
            secretKeyRef:
              key: fingerprint
              name: oci-capi-operator-capoci-auth-credentials
              optional: true
        - name: OCI_CREDENTIALS_KEY
          valueFrom:
            secretKeyRef:
              key: privateKey
              name: oci-capi-operator-capoci-auth-credentials
              optional: true
        - name: OCI_CREDENTIALS_PASSPHRASE
          valueFrom:
            secretKeyRef:
              key: passphrase
              name: oci-capi-operator-capoci-auth-credentials
              optional: true
        - name: OPERATOR_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        envFrom:
        - configMapRef:
            name: oci-capi-operator-config
        image: ghcr.io/oracle-samples/openshift-oracle-capi-autoscaling:latest
        livenessProbe:
          httpGet:
            path: /healthz
            port: 28081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        readinessProbe:
          httpGet:
            path: /readyz
            port: 28081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 1000Mi
          requests:
            cpu: 10m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      initContainers:
      - args:
        - init
        command:
        - /manager
        image: ghcr.io/oracle-samples/openshift-oracle-capi-autoscaling:latest
        env:
        - name: HOME
          value: /tmp
        - name: XDG_CACHE_HOME
          value: /tmp/.cache
        envFrom:
        - configMapRef:
            name: oci-capi-operator-config
        name: crdgen
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: oci-capi-operator-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
      - emptyDir: {}
        name: tmp

---
